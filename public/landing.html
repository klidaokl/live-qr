<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>加载中...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      max-width: 750px;
      margin: 0 auto;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* 加载状态 */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #999;
      font-size: 14px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #eee;
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 模块容器 */
    #page-content { display: none; }

    /* 图片模块 */
    .mod-image {
      width: 100%;
      overflow: hidden;
      line-height: 0;
    }
    .mod-image img {
      width: 100%;
      height: auto;
      display: block;
    }
    .mod-image a {
      display: block;
      position: relative;
    }

    /* 文字模块 */
    .mod-text {
      padding: 12px 20px;
      word-break: break-word;
      line-height: 1.6;
    }

    /* 按钮模块 */
    .mod-button {
      padding: 12px 20px;
    }
    .mod-button a {
      display: block;
      text-align: center;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      transition: opacity 0.2s;
    }
    .mod-button a:active { opacity: 0.8; }

    /* 分割线模块 */
    .mod-divider {
      height: 1px;
      background: #eee;
      margin: 0 20px;
    }

    /* 空白间距模块 */
    .mod-spacer {
      height: 20px;
    }

    /* 页脚 */
    .page-footer {
      text-align: center;
      padding: 24px 20px;
      color: #ccc;
      font-size: 11px;
    }

    /* 404 */
    #error-page {
      display: none;
      text-align: center;
      padding: 80px 20px;
      color: #999;
    }
    #error-page .icon { font-size: 64px; margin-bottom: 16px; }
    #error-page h2 { font-size: 18px; color: #666; margin-bottom: 8px; }
    #error-page p { font-size: 14px; }

    /* 通用遮罩层 */
    .guide-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      color: #fff;
      text-align: center;
    }

    /* ====== 淘口令弹窗 ====== */
    #tao-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 10000;
      color: #fff;
    }
    #tao-modal .tao-backdrop {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
    }
    #tao-modal .tao-card {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      color: #333;
      border-radius: 16px 16px 0 0;
      padding: 24px 20px 32px;
      max-width: 750px;
      margin: 0 auto;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    #tao-modal .tao-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    #tao-modal .tao-card-header h3 {
      font-size: 17px;
      font-weight: 600;
      color: #333;
    }
    #tao-modal .tao-close {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #999;
      cursor: pointer;
      border: none;
    }
    #tao-modal .tao-tip {
      font-size: 13px;
      color: #999;
      margin-bottom: 16px;
      text-align: left;
    }
    #tao-modal .tao-code-box {
      background: #f8f8f8;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: left;
    }
    #tao-modal .tao-code-text {
      font-size: 15px;
      color: #333;
      line-height: 1.7;
      word-break: break-all;
      user-select: all;
      -webkit-user-select: all;
    }
    #tao-modal .tao-copy-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: #FF6A00;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }
    #tao-modal .tao-copy-btn:active { background: #e55d00; }
    #tao-modal .tao-copy-btn.copied {
      background: #07c160;
    }
    #tao-modal .tao-steps {
      margin-top: 16px;
      padding: 12px 16px;
      background: #FFF8F0;
      border-radius: 8px;
      text-align: left;
    }
    #tao-modal .tao-steps p {
      font-size: 13px;
      color: #FF6A00;
      line-height: 1.8;
    }
    #tao-modal .tao-steps span.num {
      display: inline-block;
      width: 18px;
      height: 18px;
      line-height: 18px;
      text-align: center;
      background: #FF6A00;
      color: #fff;
      border-radius: 50%;
      font-size: 11px;
      margin-right: 6px;
      font-weight: 600;
    }

    /* ====== 浏览器引导遮罩 ====== */
    #browser-guide {
      padding: 40px 30px;
    }
    #browser-guide .arrow {
      width: 80px; height: 80px;
      position: absolute;
      top: 16px; right: 30px;
      animation: bounce 1.5s infinite;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    #browser-guide h3 {
      font-size: 20px;
      margin-top: 100px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    #browser-guide p {
      font-size: 15px;
      color: rgba(255,255,255,0.8);
      line-height: 1.8;
      margin-bottom: 30px;
    }
    #browser-guide .guide-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    #browser-guide .guide-btn {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      min-width: 260px;
      text-align: center;
    }
    #browser-guide .guide-btn.primary {
      background: #07c160;
      color: #fff;
    }
    #browser-guide .guide-btn.secondary {
      background: transparent;
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.3);
      font-size: 14px;
      font-weight: 400;
    }
    #browser-guide .copy-success {
      color: #07c160;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }
    #browser-guide .close-guide {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 加载中 -->
  <div id="loading">
    <div class="spinner"></div>
    <span>加载中...</span>
  </div>

  <!-- 错误页 -->
  <div id="error-page">
    <div class="icon">:(</div>
    <h2>页面不存在</h2>
    <p>该活码可能已被删除或链接无效</p>
  </div>

  <!-- H5 内容 -->
  <div id="page-content"></div>

  <!-- 淘口令弹窗 -->
  <div id="tao-modal">
    <div class="tao-backdrop" onclick="closeTaoModal()"></div>
    <div class="tao-card">
      <div class="tao-card-header">
        <h3>复制淘口令购买</h3>
        <button class="tao-close" onclick="closeTaoModal()">✕</button>
      </div>
      <p class="tao-tip">长按或点击下方按钮复制完整内容，打开淘宝自动弹出商品</p>
      <div class="tao-code-box">
        <div class="tao-code-text" id="taoCodeText"></div>
      </div>
      <button class="tao-copy-btn" id="taoCopyBtn" onclick="copyTaoCode()">复制淘口令</button>
      <div class="tao-steps">
        <p><span class="num">1</span>点击上方按钮复制淘口令</p>
        <p><span class="num">2</span>打开手机淘宝 / 天猫 APP</p>
        <p><span class="num">3</span>自动弹出商品页面，直接下单</p>
      </div>
    </div>
  </div>

  <!-- 浏览器引导遮罩（非淘系被屏蔽链接用） -->
  <div id="browser-guide" class="guide-overlay">
    <svg class="arrow" viewBox="0 0 80 80" fill="none">
      <path d="M40 8 L72 40 L40 28 L8 40 Z" fill="white"/>
    </svg>
    <h3>无法在微信内直接打开</h3>
    <p>该商品链接需要在浏览器中访问<br>请选择以下方式打开</p>
    <div class="guide-actions">
      <a class="guide-btn primary" href="#" id="guideCopyBtn" onclick="return false;">复制链接，稍后粘贴打开</a>
      <a class="guide-btn secondary" href="#" id="guideBrowserBtn" onclick="return false;">点右上角 ··· 在浏览器打开</a>
    </div>
    <div class="copy-success" id="copySuccess">✓ 链接已复制，打开浏览器粘贴即可</div>
    <span class="close-guide" onclick="closeBrowserGuide()">关闭此提示</span>
  </div>

  <script>
    // ========== 环境检测 ==========
    var isWechat = /MicroMessenger/i.test(navigator.userAgent);

    // 淘系域名（走淘口令流程）— 包括官方短域名
    var taobaoDomains = [
      'tmall.com', 'taobao.com',
      'tb.cn', 'e.tb.cn', 'm.tb.cn',
      'a.m.taobao.com',
      's.click.taobao.com',
      'uland.taobao.com'
    ];

    // 京东域名（在微信内可直接跳转，不拦截）
    var jdDomains = ['jd.com', '3.cn', 'm.jd.com'];

    // 其他被屏蔽域名（走浏览器引导流程）
    var otherBlockedDomains = [
      'douyin.com', 'tiktok.com',
      'pinduoduo.com', 'yangkeduo.com'
    ];

    function getLinkType(url) {
      if (!url || url === '#') return null;
      try {
        var host = new URL(url).hostname.toLowerCase();
      } catch(e) {
        var lower = url.toLowerCase();
        if (taobaoDomains.some(function(d) { return lower.indexOf(d) > -1; })) return 'taobao';
        if (otherBlockedDomains.some(function(d) { return lower.indexOf(d) > -1; })) return 'other';
        return null;
      }
      if (taobaoDomains.some(function(d) { return host === d || host.endsWith('.' + d); })) return 'taobao';
      if (otherBlockedDomains.some(function(d) { return host === d || host.endsWith('.' + d); })) return 'other';
      return null;
    }

    // ========== 淘口令弹窗 ==========
    var currentTaoLink = '';

    function showTaoModal(link, mod) {
      currentTaoLink = link || '';
      var modal = document.getElementById('tao-modal');
      var codeText = document.getElementById('taoCodeText');
      var copyBtn = document.getElementById('taoCopyBtn');

      // 优先使用模块配置的自定义淘口令，否则自动生成
      var taoCode = '';
      if (mod && mod.taoCode) {
        taoCode = mod.taoCode;
      } else {
        taoCode = generateTaoCode(link, mod ? mod.name : '');
      }
      codeText.textContent = taoCode;

      copyBtn.textContent = '复制淘口令';
      copyBtn.className = 'tao-copy-btn';

      modal.style.display = 'block';
    }

    function closeTaoModal() {
      document.getElementById('tao-modal').style.display = 'none';
    }

    function generateTaoCode(link, moduleName) {
      var name = (moduleName || '康比特好物').replace(/<[^>]+>/g, '');
      return '￥' + name + '￥\n' +
             '复制这条信息，打开淘宝即可看到【' + name + '】\n' +
             link;
    }

    function copyTaoCode() {
      var codeText = document.getElementById('taoCodeText').textContent;
      var copyBtn = document.getElementById('taoCopyBtn');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(codeText).then(function() {
          onCopySuccess(copyBtn);
        }).catch(function() {
          fallbackCopyText(codeText);
          onCopySuccess(copyBtn);
        });
      } else {
        fallbackCopyText(codeText);
        onCopySuccess(copyBtn);
      }
    }

    function onCopySuccess(btn) {
      btn.textContent = '✓ 已复制，去淘宝打开';
      btn.className = 'tao-copy-btn copied';
      // 自动选中文本方便用户手动长按复制
      var codeText = document.getElementById('taoCodeText');
      var range = document.createRange();
      range.selectNodeContents(codeText);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function fallbackCopyText(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      try { document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(ta);
    }

    // ========== 浏览器引导遮罩 ==========
    var currentBlockedLink = '';

    function showBrowserGuide(link) {
      var guide = document.getElementById('browser-guide');
      var copyBtn = document.getElementById('guideCopyBtn');
      var browserBtn = document.getElementById('guideBrowserBtn');
      var copySuccess = document.getElementById('copySuccess');
      currentBlockedLink = link || '';
      copyBtn.onclick = function(e) {
        e.preventDefault();
        fallbackCopyText(currentBlockedLink);
        copySuccess.style.display = 'block';
        return false;
      };
      browserBtn.onclick = function(e) {
        e.preventDefault();
        return false;
      };
      copySuccess.style.display = 'none';
      guide.style.display = 'block';
    }

    function closeBrowserGuide() {
      document.getElementById('browser-guide').style.display = 'none';
      return false;
    }

    // ========== 全局链接拦截 ==========
    document.addEventListener('click', function(e) {
      var a = e.target.closest('a');
      if (!a) return;
      var href = a.getAttribute('href');

      // 获取模块数据（data属性在渲染时已挂载）
      var modEl = a.closest('[data-tao-code]');
      var mod = modEl ? {
        name: modEl.getAttribute('data-module-name') || '',
        taoCode: modEl.getAttribute('data-tao-code') || ''
      } : null;

      // href="#" 或空 → 说明是无链接但配了淘口令的图片/按钮
      var hasRealLink = href && href !== '#';

      // 微信内处理
      if (isWechat) {
        var linkType = getLinkType(href);

        // 有真实链接：按域名判断走哪个流程
        if (hasRealLink) {
          if (linkType === 'taobao') {
            e.preventDefault();
            e.stopPropagation();
            showTaoModal(href, mod);
            return;
          } else if (linkType === 'other') {
            e.preventDefault();
            e.stopPropagation();
            showBrowserGuide(href);
            return;
          }
          // 其他域名（京东等）不拦截，正常跳转
          return;
        }

        // 无真实链接但配置了淘口令 → 弹淘口令
        if (mod && mod.taoCode) {
          e.preventDefault();
          e.stopPropagation();
          showTaoModal('', mod);
          return;
        }
      }
    }, true);

    // ========== 页面渲染 ==========
    (function() {
      var code = location.pathname.replace(/^\/+/, '').replace(/\/+$/, '');
      var content = document.getElementById('page-content');
      var loading = document.getElementById('loading');
      var errorPage = document.getElementById('error-page');

      if (!code) {
        showError();
        return;
      }

      fetch('/api/landing/' + encodeURIComponent(code))
        .then(function(r) {
          if (!r.ok) throw new Error('not found');
          return r.json();
        })
        .then(function(config) {
          if (!config || !config.modules || config.modules.length === 0) {
            showError();
            return;
          }
          render(config);
        })
        .catch(function() {
          showError();
        });

      function render(config) {
        document.title = config.title || '活动页面';
        if (config.bgColor) document.body.style.backgroundColor = config.bgColor;

        var html = '';
        config.modules.forEach(function(mod) {
          if (!mod) return;
          switch(mod.type) {
            case 'image': html += renderImage(mod); break;
            case 'text': html += renderText(mod); break;
            case 'button': html += renderButton(mod); break;
            case 'divider': html += '<div class="mod-divider"></div>'; break;
            case 'spacer': html += '<div class="mod-spacer" style="height:' + (mod.height || 20) + 'px"></div>'; break;
          }
        });

        html += '<div class="page-footer">Powered by 康比特</div>';
        content.innerHTML = html;
        loading.style.display = 'none';
        content.style.display = 'block';
      }

      function showError() {
        loading.style.display = 'none';
        errorPage.style.display = 'block';
      }
    })();

    function renderImage(mod) {
      var s = [];
      if (mod.borderRadius) s.push('border-radius:' + mod.borderRadius + 'px');
      if (mod.padding) s.push('padding:' + mod.padding);
      if (mod.bgColor) s.push('background-color:' + mod.bgColor);
      var style = s.join(';');

      var imgHtml = '<img src="' + escAttr(mod.src) + '" alt="" style="' + style + '" loading="lazy">';
      var dataAttrs = 'data-module-name="' + escAttr(mod.name || '') + '" data-tao-code="' + escAttr(mod.taoCode || '') + '"';
      if (mod.link) {
        // 有链接：渲染成 <a> 标签
        return '<div class="mod-image" ' + dataAttrs + '><a href="' + escAttr(mod.link) + '" target="_blank" rel="noopener">' + imgHtml + '</a></div>';
      }
      // 无链接但有淘口令：也渲染成可点击的 <a>，href 用 # 占位
      if (mod.taoCode) {
        return '<div class="mod-image" ' + dataAttrs + '><a href="#" onclick="return false;" style="display:block;cursor:pointer;">' + imgHtml + '</a></div>';
      }
      return '<div class="mod-image">' + imgHtml + '</div>';
    }

    function renderText(mod) {
      var st = mod.style || {};
      var css = [];
      if (st.fontSize) css.push('font-size:' + st.fontSize + 'px');
      if (st.color) css.push('color:' + st.color);
      if (st.align) css.push('text-align:' + st.align);
      if (st.bold) css.push('font-weight:bold');
      if (st.lineHeight) css.push('line-height:' + st.lineHeight);
      if (st.padding) css.push('padding:' + st.padding);
      if (st.bgColor) css.push('background-color:' + st.bgColor);
      var tag = st.bold ? '<strong>' + escHtml(mod.content || '') + '</strong>' : escHtml(mod.content || '');
      return '<div class="mod-text" style="' + css.join(';') + '">' + tag + '</div>';
    }

    function renderButton(mod) {
      var st = mod.style || {};
      var css = [];
      if (st.bgColor) css.push('background-color:' + st.bgColor);
      if (st.color) css.push('color:' + st.color);
      if (st.borderRadius) css.push('border-radius:' + st.borderRadius + 'px');
      if (st.fontSize) css.push('font-size:' + st.fontSize + 'px');
      if (st.margin) css.push('margin:' + st.margin);
      var link = mod.link || '#';
      var dataAttrs = 'data-module-name="' + escAttr(mod.name || mod.text || '') + '" data-tao-code="' + escAttr(mod.taoCode || '') + '"';
      return '<div class="mod-button" ' + dataAttrs + '><a href="' + escAttr(link) + '" style="' + css.join(';') + '" target="_blank" rel="noopener">' + escHtml(mod.text || '按钮') + '</a></div>';
    }

    function escAttr(s) {
      var d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    function escHtml(s) {
      var d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }
  </script>
</body>
</html>
